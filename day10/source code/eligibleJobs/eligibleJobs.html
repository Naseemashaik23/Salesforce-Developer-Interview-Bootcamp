<template>

    <!-- ====================================================== -->
<!-- MAIN CARD -->
<!-- ====================================================== -->

<lightning-card title="Eligible Jobs">

    <div class="jobs-container">


        <!-- ================================================= -->
        <!-- LOADING STATE -->
        <!-- ================================================= -->

        <template if:true={isLoading}>

            <div class="loading-container">

                <lightning-spinner
                    alternative-text="Loading eligible jobs"
                    size="medium">
                </lightning-spinner>

                <p>
                    Loading eligible jobs...
                </p>

            </div>

        </template>


        <!-- ================================================= -->
        <!-- ERROR STATE -->
        <!-- ================================================= -->

        <template if:true={errorMessage}>

            <div class="error-container">

                <p>
                    {errorMessage}
                </p>

            </div>

        </template>


        <!-- ================================================= -->
        <!-- DATA / EMPTY STATE -->
        <!-- ================================================= -->

        <template if:false={isLoading}>

            <template if:false={errorMessage}>


                <!-- ========================================= -->
                <!-- EMPTY STATE -->
                <!-- ========================================= -->

                <template if:false={jobs.length}>

                    <div class="empty-container">

                        <h2>
                            No Eligible Jobs
                        </h2>

                        <p>
                            There are currently no jobs
                            matching your eligibility.
                        </p>

                    </div>

                </template>


                <!-- ========================================= -->
                <!-- JOB LIST -->
                <!-- ========================================= -->

                <template
                    for:each={jobs}
                    for:item="job">


                    <!-- ===================================== -->
                    <!-- JOB CARD COMPONENT -->
                    <!-- ===================================== -->

                    <c-job-card
                        key={job.id}
                        job={job}
                        onviewdetails={handleViewDetails}>
                    </c-job-card>


                </template>

            </template>

        </template>

    </div>

</lightning-card>

</template>
